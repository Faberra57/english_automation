services:
  english-teacher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-teacher
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Sur un serveur Linux, ceci permet de joindre AnkiConnect sur 127.0.0.1:8765
    # tout en le laissant lié au loopback de l'hôte.
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-teacher-dashboard
    restart: unless-stopped
    init: true
    environment:
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/english_teacher.sqlite3
      AUDIO_DIR: /app/data/audio
      TZ: ${TZ:-Europe/Paris}
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
