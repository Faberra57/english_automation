services:
  english-teacher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-teacher
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/english_teacher.sqlite3
      AUDIO_DIR: /app/data/audio
      ANKICONNECT_URL: http://anki:8765
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-teacher-dashboard
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/english_teacher.sqlite3
      AUDIO_DIR: /app/data/audio
      ANKICONNECT_URL: http://anki:8765
      TZ: ${TZ:-Europe/Paris}
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  anki:
    image: chrislongros/anki-desktop:latest
    container_name: english-teacher-anki
    profiles: ["anki"]
    restart: unless-stopped
    environment:
      PUID: ${APP_UID:-1000}
      PGID: ${APP_GID:-1000}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./anki-data:/config
    # Interface graphique Anki locale uniquement. Utiliser un tunnel SSH.
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: 1gb
    security_opt:
      - seccomp=unconfined
      - no-new-privileges:true
